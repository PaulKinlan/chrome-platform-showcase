name: Showcase work-list

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "v*/**"
      - "scripts/build-worklist.mjs"
      - "scripts/sync-gendn-links.mjs"
      - "responsive-support.json"
      - "gendn-links.json"

permissions:
  contents: read

jobs:
  build-worklist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone Showcase
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Refresh matching gendn routes
        run: deno task sync-gendn-links

      - name: Build exact work-list
        run: deno task worklist

      - name: Publish summary
        run: cat reports/demo-worklist.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload machine-readable and Markdown reports
        uses: actions/upload-artifact@v4
        with:
          name: showcase-worklist-${{ github.run_number }}
          path: |
            reports/demo-worklist.json
            reports/demo-worklist.md
            gendn-links.json
          retention-days: 30
