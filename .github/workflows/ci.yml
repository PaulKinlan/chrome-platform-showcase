name: CI

# Deployment is NOT done from here: Cloudflare Workers Builds deploys on push to
# main through its own GitHub integration (see docs/cloudflare.md). This
# workflow just runs the quality gates so bad code can't ship.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type check + format check
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          # check-routes diffs the working tree against origin/main (support
          # baseline + touched-demo set, both fail-closed). A default PR
          # checkout is depth-1 of the merge ref only, so origin/main does not
          # resolve and the gate fails closed on every pull request.
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npm run fmt-check

      - name: Route + parity regression gate
        # Durable-demo route gate PLUS the mobile+desktop parity invariant:
        # fails on any published demo recorded broken on a supported class, on a
        # touched demo left untested/broken on a supported class, or on a
        # non-monotonic support regression — and reports mobile/desktop coverage
        # denominators. The full browser matrix is run by the build/hardening
        # routines and locally before push (npm run responsive-check); CI
        # enforces the recorded coverage + the gate.
        run: npm run check-routes

      - name: Responsive support coverage
        run: npm run responsive-support -- report

      - name: Cloudflare Worker host seams
        # No route, lib module or feature sidecar may call a host API directly
        # (Deno.*, node:fs, node:http would throw on Workers); KV adapter
        # ordering; asset staging.
        run: npm run test-worker-platform

      - name: Feature server registry check
        run: npm run check-feature-servers
