<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Echo frame — WebTransportError serialization</title>
  <link rel="stylesheet" href="/public/styles.css">
  <style>body { padding: var(--space-2); font-size: 0.85rem; background: var(--bg-ivory); color: var(--text-black); } p { margin: 0; overflow-wrap: anywhere; }</style>
</head>
<body>
<p id="s">Echo frame (same origin, separate realm) — waiting for a message.</p>
<script src="../wte-lib.js"></script>
<script>
(() => {
  'use strict';
  // Describes what arrived using THIS realm's WebTransportError, then posts the
  // description back. Messages from other origins are ignored.
  addEventListener('message', (ev) => {
    if (ev.origin !== location.origin || !ev.data || ev.data.kind !== 'wte-echo') return;
    const d = globalThis.WTE.describe(ev.data.payload);
    document.getElementById('s').textContent = 'Echo frame received: ' + d.kind + ' (source ' + globalThis.WTE.fmt(d.source) + ', code ' + globalThis.WTE.fmt(d.streamErrorCode) + ').';
    parent.postMessage({ kind: 'wte-echo-reply', id: ev.data.id, desc: d }, location.origin);
  });
  parent.postMessage({ kind: 'wte-echo-ready' }, location.origin);
})();
</script>
</body>
</html>
