<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opened view — Opening links in a split tab</title>
  <link rel="stylesheet" href="/public/styles.css">
  <style>
    body { background: var(--bg-ivory); color: var(--text-charcoal); }
    main { padding: var(--space-4); max-width: 60rem; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: var(--space-1) var(--space-3); margin: 0; }
    dt { font-weight: 700; }
    dd { margin: 0; overflow-wrap: anywhere; font-family: var(--font-mono); font-size: 0.85rem; }
    .card { border: 2px solid var(--border-black); background: var(--bg-paper); padding: var(--space-3); margin: var(--space-3) 0; }
    button { border: 2px solid var(--border-black); background: var(--text-black); color: var(--bg-ivory); padding: var(--space-2) var(--space-3); font: inherit; font-weight: 700; min-height: 44px; }
    button:focus-visible { outline: 3px solid var(--accent-blue); outline-offset: 2px; }
    @media (max-width: 30rem) { dl { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <p class="eyebrow">Opening links in a split tab · the opened view</p>
  <h1 id="title">Opened view</h1>
  <p id="lede">This page was opened by a <code>window.open()</code> call or a link from the demo. It measures how the browser presented it and reports back to the page that opened it.</p>
  <section class="card" aria-labelledby="m-title">
    <h2 id="m-title">What this view can observe about itself</h2>
    <dl id="facts"></dl>
    <p id="inference" role="status"></p>
  </section>
  <button type="button" id="close">Close this view (window.close())</button>
  <p><a href="./">Back to the feature overview</a></p>
</main>
<script>
(() => {
  "use strict";
  const params = new URLSearchParams(location.search);
  const run = params.get("run") || "";
  const q = params.get("q");
  if (q) {
    document.getElementById("title").textContent = `Result: ${q}`;
    document.title = `Result: ${q} — Opening links in a split tab`;
  }
  function measure() {
    return {
      src: "split-tab-target",
      run,
      q: q || null,
      hasOpener: !!window.opener,
      toolbarVisible: window.toolbar ? window.toolbar.visible : null,
      menubarVisible: window.menubar ? window.menubar.visible : null,
      innerWidth,
      innerHeight,
      outerWidth,
      screenAvailWidth: screen.availWidth,
      name: window.name,
    };
  }
  const m = measure();
  const facts = document.getElementById("facts");
  const rows = [
    ["window.opener", m.hasOpener ? "present (opener relationship kept)" : "null (noopener, or opened from a rel-less _blank link)"],
    ["toolbar.visible", String(m.toolbarVisible)],
    ["menubar.visible", String(m.menubarVisible)],
    ["innerWidth × innerHeight", `${m.innerWidth} × ${m.innerHeight}`],
    ["screen.availWidth", String(m.screenAvailWidth)],
    ["window.name", m.name || "(empty)"],
  ];
  for (const [k, v] of rows) {
    const dt = document.createElement("dt");
    dt.textContent = k;
    const dd = document.createElement("dd");
    dd.textContent = v;
    facts.append(dt, dd);
  }
  // BarProp.visible is false when the browsing context was created as a popup
  // (HTML "is popup"), so it distinguishes the legacy popup fallback from a tab.
  document.getElementById("inference").textContent = m.toolbarVisible === false
    ? "The browser treated this as a POPUP window (toolbar.visible is false)."
    : "The browser treated this as a tab, not a popup (toolbar.visible is true). A split tab is still a tab. Nothing tells the page whether it was split: the proposal deliberately exposes no result API.";
  if (window.opener) {
    try { window.opener.postMessage(m, location.origin); } catch { /* cross-origin opener */ }
  } else if ("BroadcastChannel" in self) {
    const bc = new BroadcastChannel("split-tab-demo");
    bc.postMessage(m);
    bc.close();
  }
  document.getElementById("close").addEventListener("click", () => window.close());
})();
</script>
</body>
</html>
