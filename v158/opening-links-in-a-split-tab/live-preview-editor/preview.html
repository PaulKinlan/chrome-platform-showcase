<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live preview — Opening links in a split tab</title>
  <link rel="stylesheet" href="/public/styles.css">
  <style>
    body { background: var(--bg-ivory); color: var(--text-charcoal); }
    main { padding: var(--space-4); max-width: 60rem; }
    .meta { font-family: var(--font-mono); font-size: 0.8rem; border: 2px solid var(--border-black); background: var(--bg-stone); color: var(--text-charcoal); padding: var(--space-2); overflow-wrap: anywhere; }
    article { border: 2px solid var(--border-black); background: var(--bg-paper); padding: var(--space-4); margin: var(--space-3) 0; }
    article.accent-blue h1 { color: var(--accent-blue); }
    article.accent-emerald h1 { color: var(--accent-emerald-dark); }
    article.accent-rose h1 { color: var(--accent-rose); }
    button { border: 2px solid var(--border-black); background: var(--text-black); color: var(--bg-ivory); padding: var(--space-2) var(--space-3); font: inherit; font-weight: 700; min-height: 44px; }
    button:focus-visible { outline: 3px solid var(--accent-blue); outline-offset: 2px; }
    .controls { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  </style>
</head>
<body>
<main>
  <p class="eyebrow">Live preview · opened beside the editor</p>
  <p class="meta" id="meta" role="status">Waiting for the editor…</p>
  <article id="doc" aria-live="polite"><h1 id="doc-title">Nothing yet</h1><div id="doc-body"></div></article>
  <div class="controls">
    <button type="button" id="back">Send focus back to the editor</button>
    <button type="button" id="close">Close preview (window.close())</button>
  </div>
</main>
<script>
(() => {
  "use strict";
  const meta = document.getElementById("meta");
  const opener = window.opener;
  let updates = 0;
  function size() {
    return { innerWidth, innerHeight, toolbarVisible: window.toolbar ? window.toolbar.visible : null };
  }
  function send(msg) {
    if (opener && !opener.closed) opener.postMessage(Object.assign({ src: "split-preview" }, msg), location.origin);
  }
  if (!opener) {
    meta.textContent = "No opener: this preview was opened without a handle (noopener) or directly, so it cannot receive edits.";
  } else {
    send({ type: "ready", size: size() });
    meta.textContent = `Connected to the editor. Viewport ${innerWidth}×${innerHeight}.`;
  }
  addEventListener("resize", () => send({ type: "resize", size: size() }));
  addEventListener("message", (e) => {
    // Only accept messages from the window that opened us, on our own origin.
    if (e.source !== opener || e.origin !== location.origin) return;
    const d = e.data;
    if (!d || d.src !== "split-editor" || d.type !== "render") return;
    updates++;
    const art = document.getElementById("doc");
    art.className = ["blue", "emerald", "rose"].includes(d.accent) ? `accent-${d.accent}` : "";
    document.getElementById("doc-title").textContent = String(d.title || "Untitled");
    const body = document.getElementById("doc-body");
    body.replaceChildren(...String(d.body || "").split(/\n{2,}/).map((para) => Object.assign(document.createElement("p"), { textContent: para })));
    meta.textContent = `Update #${updates} received from the editor · viewport ${innerWidth}×${innerHeight}.`;
    send({ type: "rendered", n: updates, size: size() });
  });
  document.getElementById("back").addEventListener("click", () => {
    send({ type: "focus-editor" });
    try { opener?.focus(); } catch { /* ignore */ }
  });
  document.getElementById("close").addEventListener("click", () => window.close());
})();
</script>
</body>
</html>
