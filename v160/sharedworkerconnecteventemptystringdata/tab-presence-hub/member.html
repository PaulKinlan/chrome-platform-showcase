<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hub member — Tab presence hub — chrome platform showcase</title>
  <link rel="stylesheet" href="/public/styles.css">
  <link rel="stylesheet" href="../demo.css">
  <style>
    body { margin: 0; padding: var(--space-2); background: var(--bg-paper); color: var(--text-charcoal); }
    p { margin: 0 0 var(--space-1); overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <p><strong id="me">Connecting…</strong></p>
  <p id="data">connect data: unknown</p>
  <p id="peers" aria-live="polite">peers: unknown</p>
<script>
(() => {
  "use strict";
  const label = new URLSearchParams(location.search).get("label") || "member";
  const $ = (id) => document.getElementById(id);
  if (typeof SharedWorker !== "function") {
    $("me").textContent = `${label}: SharedWorker unavailable`;
    return;
  }
  const worker = new SharedWorker("../worker.js", { name: "presence-hub" });
  worker.port.onmessage = (m) => {
    const d = m.data || {};
    if (d.type === "connected") {
      $("me").textContent = `${label} (hub client #${d.id})`;
      $("data").textContent = `connect data seen by the hub: ${d.snapshot.dataJSON}`;
      worker.port.postMessage({ type: "hello", label });
    } else if (d.type === "roster") {
      $("peers").textContent = `peers: ${d.roster.map((r) => r.label).join(", ")}`;
    }
  };
  worker.port.start();
  addEventListener("pagehide", () => worker.port.postMessage({ type: "bye" }));
})();
</script>
</body>
</html>
