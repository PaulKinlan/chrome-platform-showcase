<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>embedded slot</title>
<link rel="stylesheet" href="/public/styles.css">
<style>
  /* Only ever seen inside a frame, so the site layout is dropped and the
     tokens are kept. */
  html, body { margin: 0; height: 100%; max-width: none; }
  body { display: grid; place-items: center; gap: 0.35rem; align-content: center;
         font-family: var(--font-mono); font-size: 0.8rem; text-align: center;
         background: var(--bg-stone); color: var(--text-black); padding: 0.75rem; box-sizing: border-box; }
  p { margin: 0; }
  strong { font-size: 0.95rem; }
</style>
</head>
<body>
<p><strong>Embedded content</strong></p>
<p id="how">loaded in a frame</p>
<script>
  // The embedding page passes how it managed to render this, so the reader can
  // see which branch of the fallback actually ran.
  document.getElementById("how").textContent = new URLSearchParams(location.search).get("how") || "loaded in a frame";
</script>
</body>
</html>
