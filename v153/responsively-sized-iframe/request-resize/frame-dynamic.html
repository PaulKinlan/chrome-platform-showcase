<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="responsive-embedded-sizing" allowedorigins="'self'">
  <title>Opted-in child with dynamic content</title>
  <link rel="stylesheet" href="/public/styles.css">
  <style>
    html, body { margin: 0; padding: 0; background: var(--bg-paper); }
    .head { box-sizing: border-box; height: 44px; display: flex; align-items: center; padding: 0 var(--space-3); background: var(--bg-stone); border-bottom: 2px solid var(--border-black); font-weight: 700; font-size: 0.85rem; color: var(--text-black); }
    .item { box-sizing: border-box; height: 80px; display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-3); border-bottom: 1px solid var(--border-black); color: var(--text-charcoal); font-size: 0.8rem; }
    .item .n { flex: 0 0 auto; inline-size: 32px; block-size: 32px; display: grid; place-content: center; border: 2px solid var(--border-black); background: var(--accent-blue); color: var(--bg-ivory); font-weight: 700; }
  </style>
</head>
<body>
  <div class="head" id="head">Dynamic child — 1 block (natural height 124px)</div>
  <div id="list"><div class="item"><span class="n" aria-hidden="true">1</span><span>Block 1 — each block is exactly 80px tall.</span></div></div>
  <script>
  (() => {
    'use strict';
    let count = 1;
    const list = document.getElementById('list');
    const head = document.getElementById('head');

    function contentHeight() { return document.documentElement.scrollHeight; }

    function report(lastAction, error) {
      head.textContent = `Dynamic child — ${count} block${count === 1 ? '' : 's'} (natural height ${contentHeight()}px)`;
      parent.postMessage({
        type: 'child-state',
        contentHeight: contentHeight(),
        blocks: count,
        requestResizeAvailable: typeof window.requestResize === 'function',
        lastAction,
        error: error || null,
      }, location.origin);
    }

    function addBlock() {
      count += 1;
      const item = document.createElement('div');
      item.className = 'item';
      const n = document.createElement('span');
      n.className = 'n';
      n.setAttribute('aria-hidden', 'true');
      n.textContent = String(count);
      const label = document.createElement('span');
      label.textContent = `Block ${count} — each block is exactly 80px tall.`;
      item.append(n, label);
      list.append(item);
    }

    function callRequestResize() {
      if (typeof window.requestResize !== 'function') {
        return 'requestResize-missing';
      }
      try {
        window.requestResize();
        return null;
      } catch (e) {
        return (e && e.name) ? e.name : 'Error';
      }
    }

    addEventListener('message', (event) => {
      if (event.origin !== location.origin) return;
      const cmd = event.data && event.data.cmd;
      if (cmd === 'grow') {
        addBlock();
        report('grow (no requestResize)');
      } else if (cmd === 'grow-resize') {
        addBlock();
        const error = callRequestResize();
        report('grow + requestResize()', error);
      } else if (cmd === 'reset') {
        while (list.children.length > 1) list.lastElementChild.remove();
        count = 1;
        const error = callRequestResize();
        report('reset + requestResize()', error);
      } else if (cmd === 'report') {
        report('report');
      }
    });

    addEventListener('load', () => report('load'));
  })();
  </script>
</body>
</html>
