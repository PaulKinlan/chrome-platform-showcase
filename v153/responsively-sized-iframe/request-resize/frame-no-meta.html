<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Child without the opt-in meta — requestResize() must throw</title>
  <link rel="stylesheet" href="/public/styles.css">
  <style>
    html, body { margin: 0; padding: 0; background: var(--bg-paper); }
    .card { box-sizing: border-box; height: 120px; padding: var(--space-2) var(--space-3); border-left: 6px solid var(--accent-rose); color: var(--text-charcoal); font-size: 0.8rem; }
    .card strong { color: var(--text-black); }
    .card code { font-family: var(--font-mono); background: var(--bg-stone); padding: 0 4px; }
  </style>
</head>
<body>
  <div class="card">
    <p><strong>No opt-in meta here.</strong> When the parent asks, this document calls <code>window.requestResize()</code> anyway. Per CSS Sizing 4 &sect;5.3.2 the call must throw a <code>NotAllowedError</code> DOMException because this document's responsive-embedded-sizing flag is not true.</p>
  </div>
  <script>
  (() => {
    'use strict';
    addEventListener('message', (event) => {
      if (event.origin !== location.origin) return;
      if (event.data && event.data.cmd === 'try-resize') {
        let outcome;
        if (typeof window.requestResize !== 'function') {
          outcome = { threw: false, missing: true, name: null };
        } else {
          try {
            window.requestResize();
            outcome = { threw: false, missing: false, name: null };
          } catch (e) {
            outcome = { threw: true, missing: false, name: (e && e.name) ? e.name : 'Error', isDOMException: (typeof DOMException !== 'undefined') && (e instanceof DOMException) };
          }
        }
        parent.postMessage({ type: 'no-meta-resize-outcome', outcome }, location.origin);
      }
    });
  })();
  </script>
</body>
</html>
