<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="responsive-embedded-sizing" allowedorigins="'self'">
  <title>Opted-in child with a natural size of 480 by 360 pixels</title>
  <link rel="stylesheet" href="/public/styles.css">
  <style>
    html, body { margin: 0; padding: 0; background: var(--bg-paper); }
    .box { box-sizing: border-box; width: 480px; height: 360px; border: 4px solid var(--accent-blue); background: repeating-linear-gradient(45deg, var(--bg-stone), var(--bg-stone) 20px, var(--bg-paper) 20px, var(--bg-paper) 40px); display: grid; place-content: center; text-align: center; padding: var(--space-3); }
    .box strong { color: var(--text-black); font-size: 1.1rem; display: block; }
    .box span { color: var(--text-charcoal); font-size: 0.8rem; max-inline-size: 24rem; }
  </style>
</head>
<body>
  <div class="box">
    <strong>480 &times; 360</strong>
    <span>This child document's scrolling area is exactly 480px wide and 360px tall, and it opts in with the responsive-embedded-sizing meta. Whatever dimension the embedder's frame-sizing keyword selects comes from these numbers.</span>
  </div>
</body>
</html>
