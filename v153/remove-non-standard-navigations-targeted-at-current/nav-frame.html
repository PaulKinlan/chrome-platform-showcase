<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // The label is the whole point of this page: whichever frame ends up here is
  // the frame the navigation chose, and the concept pages read it back through
  // same-origin DOM access.
  document.title = new URLSearchParams(location.search).get("label") || "blank";
</script>
<link rel="stylesheet" href="/public/styles.css">
<style>
  /* This document is only ever seen inside an iframe, so it drops the site
     layout and keeps the tokens. */
  html, body { margin: 0; height: 100%; max-width: none; }
  body { display: grid; place-items: center; font-family: var(--font-mono); font-size: 0.95rem; font-weight: 700;
         background: var(--bg-stone); color: var(--text-black); text-align: center; padding: 0.75rem; box-sizing: border-box; }
  body[data-label="LANDED"] { background: var(--accent-emerald); color: var(--bg-ivory); }
  p { margin: 0; }
</style>
</head>
<body>
<p id="label">…</p>
<script>
  const label = document.title;
  document.body.dataset.label = label;
  document.getElementById("label").textContent = label;
</script>
</body>
</html>
