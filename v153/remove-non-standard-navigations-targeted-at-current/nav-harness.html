<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>harness</title>
<link rel="stylesheet" href="/public/styles.css">
<style>
  html, body { margin: 0; max-width: none; }
  body { font-family: var(--font-mono); font-size: 0.8rem; line-height: 1.4; background: var(--bg-stone); color: var(--text-black); padding: 0.5rem; }
  p { margin: 0 0 0.4rem; font-weight: 700; }
  .frames { display: grid; gap: 0.5rem; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  iframe { width: 100%; height: 100px; border: 2px solid var(--border-black); background: var(--bg-paper); display: block; }
  figcaption { font-size: 0.72rem; font-weight: 700; padding-bottom: 0.25rem; }
  figure { margin: 0; }
</style>
</head>
<body>
<p>harness frame (the parent of the two below)</p>
<div class="frames">
  <figure>
    <figcaption>iframe name="_current"</figcaption>
    <!-- A frame whose name is literally _current. Under the standard rules this
         is what target="_current" should find. -->
    <iframe name="_current" title="frame named _current" src="nav-frame.html?label=NAMED%20_current"></iframe>
  </figure>
  <figure>
    <figcaption>iframe name="sidecar"</figcaption>
    <iframe name="sidecar" title="frame named sidecar" src="nav-frame.html?label=NAMED%20sidecar"></iframe>
  </figure>
  <figure>
    <figcaption>iframe id="source"</figcaption>
    <iframe id="source" title="source frame with the links" src="nav-source.html"></iframe>
  </figure>
</div>
</body>
</html>
