<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Timing stage</title>
<style>
  /* A same-origin stage the parent page drives directly. It holds a media
     query that flips with the frame's own width, and a transition that can be
     started from whichever point in the event loop is being measured. */
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; font: 12px/1.4 system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; background: #f6f4ef; color: #16150f; }
  @media (prefers-color-scheme: dark) {
    body { background: #16150f; color: #f6f4ef; }
  }
  header { padding: 6px 8px; border-bottom: 2px solid currentColor; font-weight: 700; }
  main { display: grid; grid-template-columns: 1fr; }
  #panel {
    padding: 8px;
    opacity: 0.25;
    transform: translateX(-8px);
    transition: opacity 400ms linear, transform 400ms linear;
  }
  #panel.lit { opacity: 1; transform: none; }
  #width::after { content: " narrow"; }
  @media (min-width: 420px) {
    main { grid-template-columns: 140px 1fr; }
    #width::after { content: " wide"; }
  }
  #scroller { overflow: auto; height: 60px; border: 1px solid currentColor; }
  #scroller div { height: 300px; }
</style>
</head>
<body>
  <header>stage — <span id="width">frame is</span></header>
  <main>
    <div id="panel">A panel that transitions opacity and position.</div>
    <div id="scroller" tabindex="0"><div>scrollable</div></div>
  </main>
</body>
</html>
