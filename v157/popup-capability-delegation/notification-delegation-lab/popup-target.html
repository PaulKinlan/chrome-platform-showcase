<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview popup — Popup Capability Delegation</title>
  <link rel="stylesheet" href="/public/styles.css">
  <style>
    body { padding: var(--space-3); }
    .panel { border: 2px solid var(--border-black); background: var(--bg-paper); padding: var(--space-3); display: grid; gap: var(--space-2); font-family: var(--font-mono); font-size: 0.82rem; }
    .yes { color: var(--accent-emerald-dark); font-weight: 700; }
    .no { color: var(--accent-rose); font-weight: 700; }
    h1 { font-size: 1.1rem; margin: 0 0 var(--space-2); }
  </style>
</head>
<body>
<h1>Preview popup</h1>
<div class="panel" aria-live="polite">
  <p>window.opener: <span id="opener-state" class="no">checking…</span></p>
  <p>shared-state read through the opener: <span id="shared-state">—</span></p>
  <p>This is the whole point of the delegation: this window was opened by the TAB (not the worker), so it holds a live <code>window.opener</code> and can share in-memory state — no cold-start bootstrap.</p>
</div>
<script>
(() => {
  'use strict';
  const openerState = document.getElementById('opener-state');
  const shared = document.getElementById('shared-state');
  if (window.opener && !window.opener.closed) {
    openerState.textContent = 'connected';
    openerState.className = 'yes';
    try {
      // Same-origin: read a value the lab put in memory for us, synchronously.
      const value = window.opener.LAB_SHARED_STATE;
      shared.textContent = value ? JSON.stringify(value) : '(opener has no LAB_SHARED_STATE)';
    } catch (error) {
      shared.textContent = `read failed: ${error.name}`;
    }
    window.opener.postMessage({ type: 'popup-hello', openedAt: Date.now() }, location.origin);
  } else {
    openerState.textContent = 'null — no opener relationship (e.g. opened via Clients.openWindow, the cold-start fallback)';
  }
})();
</script>
</body>
</html>
